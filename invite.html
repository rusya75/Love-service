<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Для тебя ❤️</title>

    <link
        rel="stylesheet"
        href="./invite.css"
    >

</head>


<body>

    <main class="invite-page">

        <section class="invite-card">

            <div class="heart">
                ♥
            </div>


            <p class="small-title">
                Только для тебя
            </p>


            <h1>
                Для
                <span id="recipientName"></span>
                ❤️
            </h1>


            <div class="message">

                <p id="inviteMessage"></p>

            </div>


            <div class="details">


                <div class="detail">

                    <span class="detail-icon">
                        🗓️
                    </span>

                    <div>

                        <small>
                            Дата
                        </small>

                        <strong id="inviteDate"></strong>

                    </div>

                </div>


                <div class="detail">

                    <span class="detail-icon">
                        ⏰
                    </span>

                    <div>

                        <small>
                            Время
                        </small>

                        <strong id="inviteTime"></strong>

                    </div>

                </div>


                <div class="detail">

                    <span class="detail-icon">
                        📍
                    </span>

                    <div>

                        <small>
                            Место
                        </small>

                        <strong id="invitePlace"></strong>

                    </div>

                </div>


            </div>


            <div class="divider"></div>


            <p class="from">

                С любовью,

                <strong id="senderName"></strong>

                ♥

            </p>


            <!-- Кнопка поделиться -->

            <button
                type="button"
                class="share-button"
                id="shareButton"
            >
                <span>💌</span>
                Поделиться приглашением
            </button>


            <p
                class="share-status"
                id="shareStatus"
            ></p>


        </section>

    </main>


    <script src="./invite.js"></script>

</body>

</html>
