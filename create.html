<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Создать приглашение — Love</title>

    <link rel="stylesheet" href="create.css">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">
            Love<span>♥</span>
        </a>

        <a href="index.html" class="back-button">
            ← На главную
        </a>
    </header>


    <main class="create-page">

        <div class="create-header">

            <p class="small-title">
                Создадим что-то особенное
            </p>

            <h1>
                Твоё приглашение 💌
            </h1>

            <p>
                Заполни несколько простых полей,
                а мы превратим их в красивое послание.
            </p>

        </div>


        <form class="invite-form" id="inviteForm">

            <div class="form-section">

                <h2>Для кого? 💕</h2>

                <div class="form-group">

                    <label for="recipient">
                        Имя любимого человека
                    </label>

                    <input
                        type="text"
                        id="recipient"
                        placeholder="Например, Алина"
                        required
                    >

                </div>

            </div>


            <div class="form-section">

                <h2>От кого? 🌹</h2>

                <div class="form-group">

                    <label for="sender">
                        Твоё имя
                    </label>

                    <input
                        type="text"
                        id="sender"
                        placeholder="Например, Артём"
                        required
                    >

                </div>

            </div>


            <div class="form-section">

                <h2>Что ты хочешь сказать? 💌</h2>

                <div class="form-group">

                    <label for="message">
                        Твоё сообщение
                    </label>

                    <textarea
                        id="message"
                        rows="5"
                        placeholder="Напиши что-нибудь от сердца..."
                        required
                    ></textarea>

                </div>

            </div>


            <div class="form-section">

                <h2>Когда встречаемся? 🗓️</h2>

                <div class="form-row">

                    <div class="form-group">

                        <label for="date">
                            Дата
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="time">
                            Время
                        </label>

                        <input
                            type="time"
                            id="time"
                            required
                        >

                    </div>

                </div>

            </div>


            <div class="form-section">

                <h2>Где? 📍</h2>

                <div class="form-group">

                    <label for="place">
                        Место встречи
                    </label>

                    <input
                        type="text"
                        id="place"
                        placeholder="Например, любимое кафе"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="create-button"
            >
                Создать приглашение
                <span>→</span>
            </button>

        </form>

    </main>


    <script src="create.js"></script>

</body>
</html>
